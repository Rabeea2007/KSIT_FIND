spring:
  datasource:
    url: jdbc:h2:mem:ksit_find_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-test-secret-test-secret-123456
  expiration-ms: 86400000

app:
  storage:
    root-dir: ./uploads-test
